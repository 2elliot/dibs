<title>dibs Evaluation Report</title>

/>
<style>

    --ink: #141a22;
    --ink-2: #4a5462;
    --ink-3: #6d7685;
    --rule: #dde2e8;
    --rule-2: #c3cad3;
    --accent: #1f5fb0;
    --accent-wash: #e6eef9;
    --arm-dibs: #2a78d6;
    --arm-none: #eb6834;
    --arm-chat: #1baf7a;
    --pass: #0f7a3a;
    --pass-wash: #e3f3e8;
    --fail: #c23a3a;
    --fail-wash: #fbe7e6;
    --pending: #8a5a00;
    --pending-wash: #fbf0d9;
    --sig: #2a78d6;
    --sig-2: #a9c6ee;
    --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --font-mono:
      "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --step--1: 0.8125rem;
    --step-0: 1rem;
    --step-1: 1.1875rem;
    --step-2: 1.5rem;
    --step-3: 2.125rem;
    --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #10141a;
      --sheet: #171c24;
      --ink: #e9edf2;
      --ink-2: #b4bdc9;
      --ink-3: #8e98a6;
      --rule: #262d38;
      --rule-2: #364050;
      --accent: #7fb0f0;
      --accent-wash: #1b2a40;
      --arm-dibs: #3987e5;
      --arm-none: #d95926;
      --arm-chat: #199e70;
      --pass: #5cc98a;
      --pass-wash: #14301f;
      --fail: #f08080;
      --fail-wash: #3a1b1b;
      --pending: #e8b75a;
      --pending-wash: #33280f;
      --sig: #3987e5;
      --sig-2: #24426b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #10141a;
    --sheet: #171c24;
    --ink: #e9edf2;
    --ink-2: #b4bdc9;
    --ink-3: #8e98a6;
    --rule: #262d38;
    --rule-2: #364050;
    --accent: #7fb0f0;
    --accent-wash: #1b2a40;
    --arm-dibs: #3987e5;
    --arm-none: #d95926;
    --arm-chat: #199e70;
    --pass: #5cc98a;
    --pass-wash: #14301f;
    --fail: #f08080;
    --fail-wash: #3a1b1b;
    --pending: #e8b75a;
    --pending-wash: #33280f;

    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: var(--step-0);
    line-height: 1.55;

    padding-right: max(16px, env(safe-area-inset-right, 0px));

  }
  .page {
    max-width: 1060px;
    margin: 0 auto;
  }
  .prose {
    max-width: 68ch;
  }
  h1,

  h3 {

    font-weight: 500;

  tr.dim td {

  }

  .arm {

    align-items: center;

    border-radius: 2px;

  .strip {

  .slot {

<div class="page" id="app"></div>

<script>
  const DATA = /*__REPORT_DATA__*/ null;
  const $ = (s) => document.querySelector(s);
  const esc = (v) =>
    String(v ?? "").replace(
      /[&<>"']/g,
      (c) =>
        ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c],
    );
  const src = (kind, text) =>
    `<span class="src ${kind}">${esc(text ?? kind)}</span>`;
  const pct = (x) =>
    x === null || x === undefined ? "–" : `${Math.round(x * 100)}%`;
  const fmtP = (p) =>
    p === null || p === undefined
      ? "–"
      : p < 0.001
        ? "<0.001"
        : p.toFixed(3).replace(/0+$/, "").replace(/\.$/, ".0");
  const ARM = {
    dibs: "var(--arm-dibs)",
    none: "var(--arm-none)",
    chat: "var(--arm-chat)",
  };
  const arm = (a) =>
    `<span class="arm"><i style="background:${ARM[a] ?? "var(--ink-3)"}"></i>${esc(a)}</span>`;

  function wilson(k, n, z = 1.96) {
    if (!n) return { rate: null, low: null, high: null };
    const p = k / n,
      z2 = z * z,
      d = 1 + z2 / n,
      c = (p + z2 / (2 * n)) / d;
    const h = (z * Math.sqrt((p * (1 - p)) / n + z2 / (4 * n * n))) / d;
    return {
      rate: p,
      low: k === 0 ? 0 : Math.max(0, c - h),
      high: k === n ? 1 : Math.min(1, c + h),
    };
  }

  const D = DATA;
  const trials = D.trials;
  const byTrial = Object.fromEntries(trials.map((t) => [t.trial, t]));
  const scored = trials.filter((t) => t.status === "scored");
  const checkOk = (t, c) => t.metrics?.outcome?.checks?.[String(c)];
  const ev = (t) => t.evidence?.probe;
  const mut = D.mutants;
  const det = D.detector;
  const heldout = det.cases.filter((c) => c.split === "heldout");
  const keyCount = (cs, label) =>
    cs.reduce((s, c) => s + c.keys.filter((k) => k.label === label).length, 0);
  const probeRows = mut.probe?.rows ?? [];
  const mutBroken = probeRows.filter(
    (r) => r.id !== "control" && (r.changed ?? []).length > 0,
  ).length;
  const oracleRows = mut.oracle?.results ?? null;

  // ------------------------------------------------------------------------------- header
  let html = `
<header class="masthead">
  <div class="eyebrow">dibs · benchmark evaluation · S2 login + registration app</div>
  <h1>What the benchmark shows, and how sure we can be</h1>
  <p class="prose muted">dibs claims that coding agents working in parallel break each other's assumptions in ways git can't see, and that agreeing a contract from their plans prevents it. This report puts every piece of evidence in one place, says where each number comes from, and separates what is shown from what still needs runs.</p>
  <div class="meta"><span>generated ${esc(D.generatedAt.slice(0, 16).replace("T", " "))} UTC</span><span>commit ${esc(D.commit ?? "–")}</span><span>oracle ${esc(D.oracleHash)}</span><span>pre-registration ${D.preregCommit ? esc(D.preregCommit.split(" ")[0]) : "not yet committed"}</span></div>
  <div class="legend small">${src("measured")}<span class="muted">computed from the agents' code on GitHub when this report was built</span>${src("recorded")}<span class="muted">from the trial reports (hidden oracle and review, run on M3)</span>${src("pending")}<span class="muted">needs a run on M3 (oracle key or model API key)</span></div>
</header>`;

  // ------------------------------------------------------------------------------- summary
  const t1 = byTrial.T1,
    t3 = byTrial.T3;
  const reproduced =
    ev(t1) &&
    ev(t3) &&
    !ev(t1).ui.sendsAuthorizationHeader &&
    ev(t1).server.loginReturnsToken &&
    ev(t3).ui.sendsAuthorizationHeader;
  const detSplit = det.report?.splits?.heldout;
  const ranCount = D.prereg.schedule.filter((s) => s.lobby).length;
  html += `
<section aria-labelledby="s0">
  <div class="head"><h2 id="s0">Where the evaluation stands</h2></div>
  <div class="pillars">
    <div class="pillar"><div class="eyebrow">Scored trials</div><div class="big num">T1 ${t1?.metrics?.outcome.passed ?? "–"}/6 · T3 ${t3?.metrics?.outcome.passed ?? "–"}/6</div><p>Same task, agents, machines and base; only the mode differs. One trial per arm gives Fisher p = ${fmtP(D.comparison?.diff?.tiers?.fullstack?.fisherP)}: a case study, not yet a statistic.</p><div class="tags">${src("recorded")}</div></div>

      <li>The break was a cookie-versus-token assumption between two agents. It is reproduced here from the agents' own commits, independent of the hidden test.</li>
      <li>Only the three-agent integration check differed. Checks 1–5 (one agent, and the two-agent server path) passed in both runs.</li>
      <li>An infrastructure failure (T2) was excluded by a rule set before its score was known.</li>${R?.splits?.heldout ? `<li>On ${R.cases.filter((c) => c.split === "heldout").length} conflict scenarios it was never tuned on, run ${R.runsPerCase} times each, the detector caught ${R.splits.heldout.recall.k} of ${R.splits.heldout.recall.n} planted mismatches.</li>` : ""}
    </ul></div>
    <div class="ev"><div class="eyebrow">Needs round 2 first</div><ul style="list-style:disc;padding-left:18px;display:grid;gap:8px">
      <li>Any success rate or percentage improvement for dibs.</li>
      <li>That dibs beats agents who can simply message each other (the chat arm).</li>
      ${R ? `<li>That the detector is precise: on held-out cases it flags ${pct(R.splits.heldout?.falseAlarmRate.rate)} of interfaces that were already fine.</li>` : `<li>Detector accuracy figures, until <code>detector.ts</code> has run.</li>`}
      <li>That the oracle is sensitive to every failure, until <code>oracle-mutants.ts</code> has run on M3.</li>
      <li>Anything about codebases other than this one task family.</li>
    </ul></div>
  </div>
</section>`;

  // ------------------------------------------------------------------------------- 9. reproduce
  html += `
<section aria-labelledby="s9">
  <div class="head"><span class="sec-no">9 · Reproduce</span><h2 id="s9">Rebuild every number</h2></div>
<pre># Anywhere (no keys): rebuild the lobbies from GitHub, probe them and the mutants
npx tsx bench/scripts/lobby-evidence.ts 4 5 7 --mutants 7
npx tsx bench/scripts/metrics.ts 5 && npx tsx bench/scripts/metrics.ts 7
npx tsx bench/scripts/compare.ts 5 7

# Needs the model API key
ANTHROPIC_API_KEY=… npx tsx bench/scripts/detector.ts --runs 10

# Needs the oracle key (M3)
npx tsx bench/scripts/check-oracle.ts
npx tsx bench/scripts/oracle-mutants.ts

# Then rebuild this page and its data bundle
npx tsx bench/scripts/report.ts</pre>
</section>
<footer><span>Every input to this page is in the data bundle: ${esc(D.sources.length)} files.</span><span>${src("measured")} measured here · ${src("recorded")} from trial reports · ${src("pending")} needs a run on M3</span></footer>`;

  $("#app").innerHTML = html;

  // ------------------------------------------------------------------------------- power grid
  function drawGrid(n) {
    const P = D.power.find((p) => p.n === n);
    const g = $("#pgrid");
    g.style.gridTemplateColumns = `28px repeat(${n + 1}, minmax(22px, 34px))`;
    let cells = `<div class="ax" title="none passes (rows) / dibs passes (columns)">↓/→</div>`;
    for (let b = 0; b <= n; b++) cells += `<div class="ax">${b}</div>`;
    for (let a = 0; a <= n; a++) {
      cells += `<div class="ax">${a}</div>`;
      for (let b = 0; b <= n; b++) {
        const p = P.p[a][b];
        const now = n === 1 && a === 0 && b === 1;
        cells += `<div class="cell ${p < 0.05 ? "s1" : p < 0.1 ? "s2" : ""} ${now ? "now" : ""}" title="none ${a}/${n}, dibs ${b}/${n}: p = ${fmtP(p)}">${n <= 6 ? fmtP(p).replace(/^0/, "") : ""}</div>`;
      }
    }
    g.innerHTML = cells;
    const sig = [];
    for (let a = 0; a <= n; a++)
      for (let b = 0; b <= n; b++)
        if (b > a && P.p[a][b] < 0.05) sig.push([a, b]);
    const best = sig.length
      ? sig.reduce((m, x) => (x[1] - x[0] < m[1] - m[0] ? x : m))
      : null;
    $("#pgrid-read").innerHTML =
      `<b>n = ${n} per arm.</b> Rows: lobbies passing check 6 without dibs. Columns: with dibs. ${best ? `The smallest gap that counts is ${best[0]}/${n} without vs ${best[1]}/${n} with dibs (p = ${fmtP(P.p[best[0]][best[1]])}).` : `No result at this size can reach p &lt; 0.05: even ${n}/${n} vs 0/${n} gives p = ${fmtP(P.p[0][n])}.`}${n === 1 ? " The outlined square is T1 vs T3." : ""}`;
    document
      .querySelectorAll(".controls button")
      .forEach((btn) =>
        btn.setAttribute("aria-pressed", String(Number(btn.dataset.n) === n)),
      );
  }
  document
    .querySelectorAll(".controls button")
    .forEach((btn) =>
      btn.addEventListener("click", () => drawGrid(Number(btn.dataset.n))),
    );
  drawGrid(6);
</script>
