<!doctype html>
<!-- Frozen: nobody edits this file. The UI logic goes in public/app.js. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Study group kickoff</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1>Study group kickoff</h1>
      <p>Log in, then register for the kickoff session.</p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" />

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
      />

      <button id="login" type="button">Log in</button>
      <button id="register" type="button" data-event-id="evt-1">
        Register
      </button>

      <p id="status" role="status"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
